# Reviewed scanner release workflow.
# VERSION and CHANGELOG.md are updated through a pull request before dispatch.
# This is the only workflow allowed to publish container images.

name: Release

on:
  repository_dispatch:
    types: [scanner-release]
  workflow_dispatch:
    inputs:
      version:
        description: Existing VERSION value, prefixed with v (for example v1.7.31)
        required: true
        type: string
      python_version:
        description: Python minor or exact reviewed version (empty uses the source pin)
        default: '3.14'
        required: false
        type: string
      release_reason:
        description: Why this release is being dispatched by hand, recorded in the run log
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: scanner-release
  cancel-in-progress: false

jobs:
  verify-scanner-artifacts:
    name: Verify pinned scanner supply chain
    uses: ./.github/workflows/scanner-integrity.yml

  prepare-release:
    name: Approve and prepare release
    needs: verify-scanner-artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      release_ready: ${{ steps.release_metadata.outputs.release_ready }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      release_sha: ${{ steps.release_metadata.outputs.release_sha }}
      python_version: ${{ steps.python.outputs.version }}
      release_exists: ${{ steps.release_metadata.outputs.release_exists }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate the requested immutable version
        id: release_metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
          RELEASE_REASON: ${{ inputs.release_reason }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch)
              if [ "$GITHUB_ACTOR" != "sourcebastion-bot[bot]" ]; then
                echo "automated releases must be initiated by sourcebastion-bot[bot]" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_ACTOR" != "jfelten" ]; then
                echo "a manual release is restricted to owner jfelten" >&2
                exit 1
              fi
              if [ "${#RELEASE_REASON}" -lt 12 ]; then
                echo "a manual release requires a meaningful audit reason" >&2
                exit 1
              fi
              # A notice, not a warning. CONTRIBUTING documents maintainer
              # dispatch as *the* release process, so flagging it as an
              # exception made every ordinary release look like an incident.
              echo "::notice::manual release dispatched by ${GITHUB_ACTOR}: ${RELEASE_REASON}"
              ;;
            *)
              echo "unsupported release event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact vMAJOR.MINOR.PATCH value" >&2
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$expected" ]; then
            echo "requested $REQUESTED_VERSION but VERSION declares $expected" >&2
            exit 1
          fi
          release_state="$(
            gh release view "$REQUESTED_VERSION" \
              --json isDraft,targetCommitish \
              --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null || true
          )"
          if [ -n "$release_state" ]; then
            IFS=$'\t' read -r is_draft target_commitish <<< "$release_state"
            if [ "$is_draft" != "true" ]; then
              echo "$REQUESTED_VERSION is already published; release tags are immutable" >&2
              exit 1
            fi
            if [ "$target_commitish" != "$GITHUB_SHA" ]; then
              echo "draft $REQUESTED_VERSION targets $target_commitish, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify --quiet "refs/tags/$REQUESTED_VERSION"; then
              echo "$REQUESTED_VERSION tag exists without a resumable draft release" >&2
              exit 1
            fi
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_version=${REQUESTED_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Read reviewed Python version
        id: python
        env:
          REQUESTED_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          version=$(python3 scripts/python_version.py current --requested "$REQUESTED_PYTHON_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate versioned changelog entry
        env:
          VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: python3 scripts/release-changelog.py --version "$VERSION"

      - name: Create the draft release and immutable tag
        if: steps.release_metadata.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="v${VERSION}"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --draft

  validate-images:
    name: Validate release images and runtime
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      build_images: true

  build-docker-standard:
    name: Build Standard Docker Image
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-images]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile
          build-args: PYTHON_VERSION=${{ needs.prepare-release.outputs.python_version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            io.sourcebastion.python.version=${{ needs.prepare-release.outputs.python_version }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}
            org.opencontainers.image.title=sourcebastion-scanner
            org.opencontainers.image.description=SourceBastion application security scanner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest standard image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-scan:
    name: Release Security Scan
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker-standard]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: write
      packages: read
      security-events: write
    outputs:
      findings-count: ${{ steps.count.outputs.findings-count }}
      critical-count: ${{ steps.count.outputs.critical-count }}
      high-count: ${{ steps.count.outputs.high-count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SourceBastion Scan via release image
        # Scan the exact staged digest before any public release tag moves.
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          mkdir -p scan-results
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            github-scan . --output scan-results/ez-appsec.sarif --severity medium

      - name: Generate vulnerabilities.json
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            gitlab-scan . --output scan-results/vulnerabilities.json

      - name: Count findings
        id: count
        run: |
          python3 - << 'PYEOF'
          import json, os

          sarif = json.load(open("scan-results/ez-appsec.sarif"))
          results = sarif["runs"][0]["results"]
          total = len(results)

          severity_map = {"error": "critical", "warning": "high", "note": "medium"}
          counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
          for r in results:
              level = r.get("level", "note")
              sev = severity_map.get(level, "low")
              counts[sev] = counts.get(sev, 0) + 1

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a") as f:
              f.write(f"findings-count={total}\n")
              f.write(f"critical-count={counts['critical']}\n")
              f.write(f"high-count={counts['high']}\n")

          print(f"Total: {total}  Critical: {counts['critical']}  High: {counts['high']}")
          PYEOF

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: scan-results/ez-appsec.sarif
          category: release-scan
        continue-on-error: true

      - name: Generate SBOM
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            scan . --sbom --sbom-output scan-results/sbom.cdx.json \
              --severity medium --output scan-results/sbom-scan.json
          test -s scan-results/sbom.cdx.json

      - name: Upload scan artifacts to GitHub Release
        run: |
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          gh release upload "v${VERSION}" scan-results/ez-appsec.sarif --clobber
          if [ -f scan-results/vulnerabilities.json ]; then
            gh release upload "v${VERSION}" scan-results/vulnerabilities.json --clobber
          fi
          if [ -f scan-results/sbom.cdx.json ]; then
            gh release upload "v${VERSION}" scan-results/sbom.cdx.json --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hosted-scan:
    name: Test staged hosted scan (${{ matrix.arch }})
    needs: [prepare-release, build-docker-standard]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a real offline scan from the staged digest
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: bash scripts/smoke-scan-hosted.sh "$RELEASE_IMAGE"

  promote-images:
    name: Promote validated image tags
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker-standard, release-scan, hosted-scan]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested digests to public release tags
        env:
          VERSION: ${{ needs.prepare-release.outputs.release_version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          STANDARD_DIGEST: ${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          for digest in "$STANDARD_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "refusing to promote invalid image digest" >&2
              exit 1
            fi
          done

          docker buildx imagetools create \
            --tag "${image}:v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}" \
            --tag "${image}:latest" \
            "${image}@${STANDARD_DIGEST}"

  update-github-release:
    name: Update GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, promote-images, release-scan]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Create GitHub Release with Docker Info
        run: |
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          FINDINGS="${{ needs.release-scan.outputs.findings-count }}"
          CRITICAL="${{ needs.release-scan.outputs.critical-count }}"
          HIGH="${{ needs.release-scan.outputs.high-count }}"

          {
            echo "## Security Scan"
            echo ""
            echo "This release was scanned with SourceBastion Scan v${VERSION}."
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | ${CRITICAL} |"
            echo "| High     | ${HIGH} |"
            echo "| Total (medium+) | ${FINDINGS} |"
            echo ""
            echo "📊 Full results: [SourceBastion.sarif](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/ez-appsec.sarif) · [vulnerabilities.json](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/vulnerabilities.json)"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "| Image (AMD64 and ARM64) | Tag |"
            echo "|---------|-----|"
            echo "| Complete scanner | \`${REGISTRY}/${IMAGE_NAME}:v${VERSION}\` |"
            echo "| Latest scanner      | \`${REGISTRY}/${IMAGE_NAME}:latest\` |"
            echo ""
            echo "### Quick Start"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
            echo "docker run --rm ${REGISTRY}/${IMAGE_NAME}:v${VERSION} --version"
            echo '```'
          } > /tmp/release_addendum.md

          # Fetch existing release notes then append
          gh release view "v${VERSION}" --json body -q .body > /tmp/existing_notes.md
          python3 scripts/release-changelog.py --version "$VERSION" \
            --notes-file /tmp/existing_notes.md > /tmp/release_notes.md
          cat /tmp/release_addendum.md >> /tmp/release_notes.md
          gh release edit "v${VERSION}" --notes-file /tmp/release_notes.md --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
