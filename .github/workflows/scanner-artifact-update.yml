name: Propose verified scanner artifacts

on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scanner-artifact-update
  cancel-in-progress: false

jobs:
  retain-runtime:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/runtime-inputs.yml

  propose:
    needs: retain-runtime
    if: github.ref == 'refs/heads/main'
    environment: scanner-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Install pinned verifier
        run: python -m pip install pypi-attestations==0.0.30 uv==0.11.0 packaging==26.3 pytest pyyaml
      - name: Discover and verify candidate without executing its code
        run: python scripts/scanner_artifacts.py candidate --native-proposal .github/bundled-native-proposal.json
      - name: Test candidate lock and rejection behavior
        run: python -m pytest -q tests/test_scanner_artifacts.py tests/test_python_dependency_locks.py tests/test_scanner_pins.py tests/test_bundled_native_libraries.py tests/test_native_notices.py
      - name: Upload verified candidate for review or manual recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-scanner-pins
          include-hidden-files: true
          path: |
            .github/semgrep-artifacts.json
            .github/scanner-versions.json
            .github/python-locks/
            .github/bundled-native-libraries.json
            .github/bundled-native-proposal.json
      - name: Check for a verified version change
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scanner-versions.json .github/semgrep-artifacts.json .github/python-locks .github/bundled-native-libraries.json && [ ! -f .github/bundled-native-proposal.json ]; then
            echo 'No verified artifact or dependency change.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Mint repository-scoped SourceBastion bot token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SOURCEBASTION_BOT_APP_ID }}
          private-key: ${{ secrets.SOURCEBASTION_BOT_PRIVATE_KEY }}
          # `owner` and `repositories` are deliberately unset. The action
          # documents that omitting both scopes the token "to only the current
          # repository", while setting `owner` with an empty `repositories`
          # scopes it to *every* repository in that owner's installation.
          # `github.event.repository.name` is populated for workflow_dispatch
          # but must not be relied on for `schedule`, and the failure is silent
          # and in the wrong direction: org-wide Contents and Pull requests
          # write instead of one repository. Do not reintroduce `owner` here
          # without a literal repository list beside it.
          permission-contents: write
          permission-pull-requests: write
      - name: Classify generated changes and select the owned candidate
        if: steps.changes.outputs.changed == 'true'
        id: policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python scripts/automated_scanner_update.py --prepare
      - name: Prepare the next patch release in the candidate
        if: steps.changes.outputs.changed == 'true'
        env:
          RELEASE_NOTES: Updated verified Semgrep artifacts and locked dependencies; unchanged native bytes retain reviewed notices and sources.
        run: python scripts/prepare_release.py
      - name: Refresh the bot candidate on the current main branch
        if: steps.changes.outputs.changed == 'true'
        id: candidate
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.policy.outputs.branch }}
          base: main
          author: sourcebastion-bot[bot] <sourcebastion-bot[bot]@users.noreply.github.com>
          committer: sourcebastion-bot[bot] <sourcebastion-bot[bot]@users.noreply.github.com>
          draft: ${{ steps.policy.outputs.draft }}
          commit-message: 'chore(deps): update verified Semgrep artifacts and patch release'
          title: 'chore(deps): verified Semgrep update'
          body: 'Verified four Linux wheel attestations and dependency locks. Required CI gates auto-merge when native bytes, ownership, paths, sources and notices remain unchanged. Native proposals remain drafts requiring review. Includes the next patch VERSION and changelog so the existing exact-digest release pipeline runs after merge.'
          add-paths: |
            .github/scanner-versions.json
            .github/semgrep-artifacts.json
            .github/python-locks/
            .github/bundled-native-libraries.json
            .github/bundled-native-proposal.json
            VERSION
            CHANGELOG.md
      - name: Enable standard auto-merge only for an eligible exact head
        if: steps.candidate.outputs.pull-request-number != '' && steps.policy.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.candidate.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" || test "$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)" = false
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
