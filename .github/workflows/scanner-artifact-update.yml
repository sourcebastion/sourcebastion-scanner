name: Refresh retained scanner runtime inputs

on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scanner-artifact-update
  cancel-in-progress: false

jobs:
  retain-runtime:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/runtime-inputs.yml
