# Docker validation workflow.
# PRs and releases build and exercise the complete scanner on AMD64 and ARM64.
# release.yml is the sole scanner image publisher.

name: Docker Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_images:
        description: Build and exercise both architectures without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_images:
        description: Validate both architectures before release publication
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # LINT STAGE
  # ============================================

  lint-python:
    name: Lint Python Code
    # Dependabot branches get ecosystem-targeted checks. The weekly integration
    # PR runs this full workflow once after their lockfiles are consolidated.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION

      - name: Install linting tools
        run: |
          pip install --no-cache-dir pylint flake8 black isort

      - name: Run flake8
        run: |
          echo "🔍 Linting Python code with flake8..."
          flake8 sourcebastion tests --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ flake8 passed"

      - name: Validate GitHub workflow syntax and expressions
        run: bash scripts/check-workflows.sh

      - name: Check black formatting
        run: |
          echo "🔍 Checking code style with black..."
          black --check sourcebastion tests || true
          echo "ℹ️  black formatting suggestions noted (not enforced)"

      - name: Check import sorting
        run: |
          echo "🔍 Checking import sorting with isort..."
          isort --check-only sourcebastion tests || true
          echo "ℹ️  isort suggestions noted (not enforced)"

      - name: Run pylint
        run: |
          echo "🔍 Linting with pylint..."
          pylint sourcebastion --exit-zero --max-line-length=120
          echo "✓ Pylint checks completed"

  lint-docker:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run hadolint (standard)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/Dockerfile
          failure-threshold: warning

  lint-rule-fixtures:
    name: Lint Rule Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install language runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby php-cli
          # node is preinstalled on ubuntu-latest

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION

      - name: Install semgrep and pytest
        run: |
          pip install --no-cache-dir semgrep pyyaml pytest

      - name: Syntax-check Ruby fixtures
        run: |
          echo "🔍 Checking Ruby fixture syntax (ruby -c)..."
          fail=0
          for f in rules/*/tests/*.rb; do
            if ! ruby -c "$f" >/dev/null; then echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Syntax-check PHP fixtures
        run: |
          echo "🔍 Checking PHP fixture syntax (php -l)..."
          fail=0
          for f in rules/*/tests/*.php; do
            if ! php -l "$f" >/dev/null 2>&1; then echo "  FAIL $f"; php -l "$f"; fail=1; fi
          done
          exit $fail

      - name: Syntax-check JavaScript fixtures
        run: |
          echo "🔍 Checking JavaScript fixture syntax (node --check)..."
          fail=0
          for f in rules/*/tests/*.js; do
            if ! node --check "$f" 2>/dev/null; then echo "  FAIL $f"; node --check "$f"; fail=1; fi
          done
          exit $fail

      - name: Run semgrep rule fixture tests
        run: |
          echo "🧪 Verifying each rule fires on its TP and is clean on its TN..."
          pytest tests/test_rule_fixtures.py -q

  # ============================================
  # TEST STAGE
  # ============================================

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION

      - name: Install locked packaging tools
        run: python scripts/scanner_artifacts.py install --libc glibc --group build

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .
          pip install --no-cache-dir pytest pytest-cov pytest-xdist psutil jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 rpds-py==2026.6.3 jsonschema-specifications==2025.9.1 typing-extensions==4.16.0

      - name: Install trusted host Node for inventory selector tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nodejs
          /usr/bin/node --version

      - name: Run tests
        run: |
          echo "🧪 Running unit tests with pytest..."
          pytest tests/ -v --cov=sourcebastion --cov-report=term-missing --cov-report=xml --cov-report=html -n auto

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION

      - name: Install security tools
        run: pip install --no-cache-dir bandit safety

      - name: Run bandit
        run: |
          echo "🔒 Running security checks with bandit..."
          bandit -r sourcebastion -ll --exit-zero || true
          echo "✓ Bandit checks completed"

      - name: Check dependencies with safety
        run: |
          echo "🔒 Checking dependencies with safety..."
          pip install -r requirements.txt
          safety check --json || true
          echo "✓ Safety checks completed"
        continue-on-error: true

  # ============================================
  # BUILD STAGE
  # ============================================

  build-scanner:
    name: Build scanner (${{ matrix.arch }})
    if: github.event_name == 'pull_request' || inputs.build_images == true
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    needs: [lint-python, test-unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Read reviewed Python version
        id: python
        run: echo "version=$(python3 scripts/python_version.py current)" >> "$GITHUB_OUTPUT"

      - name: Run Docker build checks (warnings are errors)
        env:
          SOURCEBASTION_PYTHON_VERSION: ${{ steps.python.outputs.version }}
        run: |
          docker buildx build --check --build-arg "PYTHON_VERSION=$SOURCEBASTION_PYTHON_VERSION" -f images/Dockerfile .

      - name: Build scanner image with retries
        id: build
        uses: ./.github/actions/build-with-retry
        with:
          context: .
          file: ./images/Dockerfile
          load: true
          tags: sourcebastion:standard-rule-test
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          cache-from: type=gha,scope=scanner-${{ matrix.arch }}
          cache-to: type=gha,scope=scanner-${{ matrix.arch }},mode=max
          platforms: linux/${{ matrix.arch }}

      - name: Record image size
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker image inspect sourcebastion:standard-rule-test --format '{{json .}}' > image-inspect.json
          python3 scripts/report_image_size.py image-inspect.json "$IMAGE_ARCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image size evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-image-${{ matrix.arch }}
          path: image-inspect.json

      - name: Assert the image reports the release version
        # Tests the artifact that ships, not the source it came from:
        # a packaging mistake survives every unit test but not this.
        run: |
          scripts/assert-image-version.sh sourcebastion:standard-rule-test
          scripts/assert-image-runtime.sh sourcebastion:standard-rule-test

      - name: Run rule fixture tests in standard image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-rule-fixtures.py

      - name: Run scanner integration tests in standard image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-scanner-integration.py

      - name: Exercise installed dependency discovery offline
        id: inventory_discovery
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-inventory-discovery.py > inventory-native.json

      - name: Upload native discovery evidence
        if: always() && steps.inventory_discovery.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-discovery-${{ matrix.arch }}
          path: inventory-native.json
          if-no-files-found: error

      - name: Exercise installed inventory foundation offline
        id: inventory_foundation
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-inventory-foundation.py > inventory-foundation-native.json

      - name: Upload native inventory foundation evidence
        if: always() && steps.inventory_foundation.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-foundation-${{ matrix.arch }}
          path: inventory-foundation-native.json
          if-no-files-found: error

      - name: Exercise installed requirements composition offline
        id: inventory_composition
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-inventory-composition.py > inventory-composition-native.json

      - name: Upload native requirements composition evidence
        if: always() && steps.inventory_composition.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-composition-${{ matrix.arch }}
          path: inventory-composition-native.json
          if-no-files-found: error

      - name: Exercise installed canonical CycloneDX export offline
        id: inventory_cyclonedx
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            sourcebastion:standard-rule-test scripts/verify-inventory-cyclonedx.py > inventory-cyclonedx-native.json

      - name: Validate retained native CycloneDX bytes offline
        id: inventory_cyclonedx_validation
        run: |
          python3 -m venv "$RUNNER_TEMP/cyclonedx-validator"
          "$RUNNER_TEMP/cyclonedx-validator/bin/pip" download --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/cyclonedx-validator/wheels" \
            jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 rpds-py==2026.6.3 \
            jsonschema-specifications==2025.9.1 typing-extensions==4.16.0 > cyclonedx-validator-download.log
          "$RUNNER_TEMP/cyclonedx-validator/bin/pip" install --no-index \
            --find-links "$RUNNER_TEMP/cyclonedx-validator/wheels" \
            jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 rpds-py==2026.6.3 \
            jsonschema-specifications==2025.9.1 typing-extensions==4.16.0 > cyclonedx-validator-install.log
          timeout 150s "$RUNNER_TEMP/cyclonedx-validator/bin/python" \
            scripts/validate-inventory-cyclonedx.py inventory-cyclonedx-native.json > inventory-cyclonedx-validation.json

      - name: Upload native CycloneDX export and validation evidence
        if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.inventory_cyclonedx.outcome)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-cyclonedx-${{ matrix.arch }}
          path: |
            inventory-cyclonedx-native.json
            inventory-cyclonedx-validation.json
            cyclonedx-validator-download.log
            cyclonedx-validator-install.log
            ${{ runner.temp }}/cyclonedx-validator/wheels/*.whl

      - name: Build pinned restricted provider outside customer scanning
        id: inventory_provider_preparation
        run: python3 scripts/build-inventory-provider.py --output "$RUNNER_TEMP/inventory-provider"

      - name: Exercise installed source-bound provider protocol offline
        id: inventory_provider
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            -v "$RUNNER_TEMP/inventory-provider/sourcebastion-inventory-provider:/provider:ro" \
            -v "$RUNNER_TEMP/inventory-provider/manifest.json:/provider-manifest.json:ro" \
            sourcebastion:standard-rule-test scripts/verify-inventory-provider.py \
              --binary /provider --preparation /provider-manifest.json > inventory-provider-native.json

      - name: Exercise maintained Go source parser offline
        id: inventory_go_source
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --cpus 2 --memory 2g --memory-swap 2g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            -v "$RUNNER_TEMP/inventory-provider/sourcebastion-go-source:/go-source:ro" \
            -v "$RUNNER_TEMP/inventory-provider/manifest.json:/provider-manifest.json:ro" \
            sourcebastion:standard-rule-test scripts/verify-go-source.py \
              --binary /go-source --preparation /provider-manifest.json > inventory-go-source-native.json

      - name: Upload native provider and preparation evidence
        if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.inventory_provider_preparation.outcome)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-provider-${{ matrix.arch }}
          path: |
            inventory-provider-native.json
            inventory-go-source-native.json
            ${{ runner.temp }}/inventory-provider/manifest.json
            ${{ runner.temp }}/inventory-provider/sourcebastion-inventory-provider
            ${{ runner.temp }}/inventory-provider/sourcebastion-go-source
            ${{ runner.temp }}/inventory-provider/go.tar.gz
            ${{ runner.temp }}/inventory-provider/*.stdout
            ${{ runner.temp }}/inventory-provider/*.stderr
          if-no-files-found: error
          retention-days: 7

      - name: Exercise release scanner runtime
        run: |
          smoke_dir="$RUNNER_TEMP/release-scanner-runtime"
          mkdir -p "$smoke_dir/scan-results"
          printf 'six==1.17.0\n' > "$smoke_dir/requirements.txt"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/scripts/run-scanner-container.sh" \
            sourcebastion:standard-rule-test \
            scan . --sbom --sbom-output scan-results/sbom.cdx.json \
              --severity medium --output scan-results/scan.json
          test -d .grype-deps
          test -s scan-results/scan.json
          test -s scan-results/sbom.cdx.json

      - name: Scan a real application with the built image
        # The final check, and the only one that runs every scanner for real
        # against a corpus with real findings. The integration check above
        # patches subprocess.run, so it proves parsing and not execution --
        # which is how a broken grype path and a semgrep failure that
        # discarded whole scans both reached a release.
        run: |
          scripts/smoke-scan-juice-shop.sh sourcebastion:standard-rule-test

      - name: Run the IaC component for real
        # The Juice Shop corpus has no infrastructure code, so it cannot
        # exercise KICS. This is the check that would have caught KICS
        # discarding every finding for every repository.
        run: |
          scripts/smoke-scan-iac.sh sourcebastion:standard-rule-test

      - name: Scan through the offline hosted-worker boundary
        run: bash scripts/smoke-scan-hosted.sh sourcebastion:standard-rule-test


  build-docker-standard:
    name: Build Standard Docker Image
    if: always() && (github.event_name == 'pull_request' || inputs.build_images == true)
    needs: build-scanner
    runs-on: ubuntu-latest
    steps:
      - name: Require both native image builds and scanner checks
        env:
          BUILD_RESULT: ${{ needs.build-scanner.result }}
        run: test "$BUILD_RESULT" = success
