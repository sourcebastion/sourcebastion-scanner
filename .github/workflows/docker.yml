# Docker validation workflow.
# Builds every image variant without publishing; release.yml is the sole publisher.

name: Docker Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ============================================
  # LINT STAGE
  # ============================================

  lint-python:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install --no-cache-dir pylint flake8 black isort

      - name: Run flake8
        run: |
          echo "🔍 Linting Python code with flake8..."
          flake8 ez_appsec tests --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "✓ flake8 passed"

      - name: Check black formatting
        run: |
          echo "🔍 Checking code style with black..."
          black --check ez_appsec tests || true
          echo "ℹ️  black formatting suggestions noted (not enforced)"

      - name: Check import sorting
        run: |
          echo "🔍 Checking import sorting with isort..."
          isort --check-only ez_appsec tests || true
          echo "ℹ️  isort suggestions noted (not enforced)"

      - name: Run pylint
        run: |
          echo "🔍 Linting with pylint..."
          pylint ez_appsec --exit-zero --max-line-length=120
          echo "✓ Pylint checks completed"

  lint-docker:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hadolint (standard)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/Dockerfile
          failure-threshold: error

      - name: Run hadolint (slim)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/Dockerfile.slim
          failure-threshold: error

      - name: Run hadolint (micro)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/Dockerfile.micro
          failure-threshold: error

      - name: Run hadolint (semgrep)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/Dockerfile.semgrep
          failure-threshold: error

  lint-rule-fixtures:
    name: Lint Rule Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install language runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby php-cli
          # node is preinstalled on ubuntu-latest

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install semgrep and pytest
        run: |
          pip install --no-cache-dir semgrep pyyaml pytest

      - name: Syntax-check Ruby fixtures
        run: |
          echo "🔍 Checking Ruby fixture syntax (ruby -c)..."
          fail=0
          for f in rules/*/tests/*.rb; do
            if ! ruby -c "$f" >/dev/null; then echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Syntax-check PHP fixtures
        run: |
          echo "🔍 Checking PHP fixture syntax (php -l)..."
          fail=0
          for f in rules/*/tests/*.php; do
            if ! php -l "$f" >/dev/null 2>&1; then echo "  FAIL $f"; php -l "$f"; fail=1; fi
          done
          exit $fail

      - name: Syntax-check JavaScript fixtures
        run: |
          echo "🔍 Checking JavaScript fixture syntax (node --check)..."
          fail=0
          for f in rules/*/tests/*.js; do
            if ! node --check "$f" 2>/dev/null; then echo "  FAIL $f"; node --check "$f"; fail=1; fi
          done
          exit $fail

      - name: Run semgrep rule fixture tests
        run: |
          echo "🧪 Verifying each rule fires on its TP and is clean on its TN..."
          pytest tests/test_rule_fixtures.py -q

  # ============================================
  # TEST STAGE
  # ============================================

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .
          pip install --no-cache-dir pytest pytest-cov pytest-xdist psutil

      - name: Run tests
        run: |
          echo "🧪 Running unit tests with pytest..."
          pytest tests/ -v --cov=ez_appsec --cov-report=term-missing --cov-report=xml --cov-report=html -n auto

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install --no-cache-dir bandit safety

      - name: Run bandit
        run: |
          echo "🔒 Running security checks with bandit..."
          bandit -r ez_appsec -ll --exit-zero || true
          echo "✓ Bandit checks completed"

      - name: Check dependencies with safety
        run: |
          echo "🔒 Checking dependencies with safety..."
          pip install -r requirements.txt
          safety check --json || true
          echo "✓ Safety checks completed"
        continue-on-error: true

  # ============================================
  # BUILD STAGE
  # ============================================

  build-docker-standard:
    name: Build Standard Docker Image
    runs-on: ubuntu-latest
    needs: [lint-python, test-unit]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push standard image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build local standard image for rule fixture tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile
          push: false
          load: true
          tags: ez-appsec:standard-rule-test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Run rule fixture tests in standard image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:standard-rule-test scripts/verify-rule-fixtures.py

      - name: Run scanner integration tests in standard image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:standard-rule-test scripts/verify-scanner-integration.py

  build-docker-slim:
    name: Build Slim Docker Image
    runs-on: ubuntu-latest
    needs: [lint-python, test-unit]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-slim
            type=ref,event=pr,suffix=-slim
            type=semver,pattern={{version}},suffix=-slim
            type=semver,pattern={{major}}.{{minor}},suffix=-slim
            type=sha,prefix=,suffix=-slim
            type=raw,value=slim,enable={{is_default_branch}}

      - name: Build and push slim image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.slim
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build local slim image for rule fixture tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.slim
          push: false
          load: true
          tags: ez-appsec:slim-rule-test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Run rule fixture tests in slim image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:slim-rule-test scripts/verify-rule-fixtures.py

  build-docker-micro:
    name: Build Micro Docker Image
    runs-on: ubuntu-latest
    needs: [lint-python, test-unit]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-micro
            type=ref,event=pr,suffix=-micro
            type=semver,pattern={{version}},suffix=-micro
            type=semver,pattern={{major}}.{{minor}},suffix=-micro
            type=sha,prefix=,suffix=-micro
            type=raw,value=micro,enable={{is_default_branch}}

      - name: Build and push micro image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.micro
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build local micro image for rule fixture tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.micro
          push: false
          load: true
          tags: ez-appsec:micro-rule-test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Verify micro image intentionally skips rule fixture tests
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:micro-rule-test scripts/verify-rule-fixtures.py --allow-missing-semgrep

  build-docker-thin:
    name: Build Thin Docker Image
    runs-on: ubuntu-latest
    needs: [lint-python, test-unit]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-thin
            type=ref,event=pr,suffix=-thin
            type=semver,pattern={{version}},suffix=-thin
            type=semver,pattern={{major}}.{{minor}},suffix=-thin
            type=sha,prefix=,suffix=-thin
            type=raw,value=thin,enable={{is_default_branch}}

      - name: Build and push thin image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.thin
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build local thin image for rule fixture tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.thin
          push: false
          load: true
          tags: ez-appsec:thin-rule-test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Run rule fixture tests in thin image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:thin-rule-test scripts/verify-rule-fixtures.py

  build-docker-semgrep:
    name: Build Semgrep Docker Image
    runs-on: ubuntu-latest
    needs: [lint-python, test-unit]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-semgrep
            type=ref,event=pr,suffix=-semgrep
            type=semver,pattern={{version}},suffix=-semgrep
            type=semver,pattern={{major}}.{{minor}},suffix=-semgrep
            type=sha,prefix=,suffix=-semgrep
            type=raw,value=semgrep,enable={{is_default_branch}}

      - name: Build and push semgrep image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.semgrep
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build local semgrep image for rule fixture tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.semgrep
          push: false
          load: true
          tags: ez-appsec:semgrep-rule-test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Run rule fixture tests in semgrep image
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD:/workspace:ro" -w /workspace \
            ez-appsec:semgrep-rule-test scripts/verify-rule-fixtures.py
