# SourceBastion Scan — customer workflow template
# Provisioned automatically when you install the SourceBastion GitHub App.

name: SourceBastion Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to Security tab
  actions: read
  pull-requests: write   # Required for PR comments
  packages: read         # Required to pull the SourceBastion scanner image

env:
  EZ_APPSEC_OUTPUT_DIR: "scan-results"
  EZ_APPSEC_SARIF: "scan-results/ez-appsec.sarif"

jobs:
  # Advisory: check if a newer SourceBastion Scan version is available. Never blocks the scan.
  version-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for newer SourceBastion Scan release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ vars.EZ_APPSEC_VERSION || 'latest' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          current = os.environ.get("CURRENT_VERSION", "latest")
          req = urllib.request.Request(
              "https://api.github.com/repos/sourcebastion/sourcebastion-scanner/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "sourcebastion-scan-version-check/1.0",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  latest = json.load(response)["tag_name"].lstrip("v")
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError, json.JSONDecodeError) as exc:
              print(f"::notice::SourceBastion Scan version check skipped: could not fetch latest release ({exc})")
              sys.exit(0)

          if current == "latest":
              print(
                  "::warning::SourceBastion Scan: using 'latest' image tag. "
                  "Pin EZ_APPSEC_VERSION to a specific version for reproducible scans. "
                  f"Current release: {latest}"
              )
          elif current != latest:
              print(
                  f"::warning::SourceBastion Scan {current} is outdated. Latest release: {latest}. "
                  "Update the EZ_APPSEC_VERSION variable."
              )
          else:
              print(f"SourceBastion Scan {current} is up to date.")
          PY

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sourcebastion/sourcebastion-scanner:latest
      options: --user root --entrypoint ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use checked-out scanner when dogfooding
        if: github.repository == 'sourcebastion/sourcebastion-scanner'
        run: pip install --no-deps -e .

      - name: Run SourceBastion Scan
        id: scan
        run: |
          echo "Running SourceBastion Scan..."
          mkdir -p "${EZ_APPSEC_OUTPUT_DIR}"

          echo "Checking SourceBastion Scan status..."
          ez-appsec status || true

          echo "Starting GitHub SARIF scan..."
          # Use 'all' severity for PRs, 'medium' for main branch
          SEVERITY="${{ github.event_name == 'pull_request' && 'all' || 'medium' }}"
          echo "Severity level: $SEVERITY"
          ez-appsec github-scan . --output "${EZ_APPSEC_SARIF}" --severity "$SEVERITY"

          echo "Scan completed. Checking for output file..."
          if [ -f "${EZ_APPSEC_SARIF}" ]; then
            echo "SARIF file created successfully"
            ls -lh "${EZ_APPSEC_SARIF}"
          else
            echo "ERROR: SARIF file not created at ${EZ_APPSEC_SARIF}"
            exit 1
          fi

      - name: Count findings
        id: summary
        run: |
          if [ ! -f "${EZ_APPSEC_SARIF}" ]; then
            echo "findings-count=0" >> "$GITHUB_OUTPUT"
            echo "No findings found"
            exit 0
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('${EZ_APPSEC_SARIF}'))['runs'][0]['results']))")
          echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT security findings"

      - name: Validate SARIF for GitHub upload
        if: always()
        run: |
          if [ ! -f "${EZ_APPSEC_SARIF}" ]; then
            echo "No SARIF file found; skipping validation"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os

          sarif_path = os.environ["EZ_APPSEC_SARIF"]

          def coerce_uri(value):
              if isinstance(value, dict):
                  for key in ("uri", "file", "path", "name"):
                      nested = value.get(key)
                      if nested:
                          return coerce_uri(nested)
                  return "unknown"
              if isinstance(value, (list, tuple)):
                  for item in value:
                      if item:
                          return coerce_uri(item)
                  return "unknown"
              if value is None:
                  return "unknown"
              text = str(value).strip()
              return text.replace("\\\\", "/") if text else "unknown"

          with open(sarif_path, encoding="utf-8") as fh:
              sarif = json.load(fh)

          fixes = 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  for location in result.get("locations", []):
                      artifact = location.get("physicalLocation", {}).get("artifactLocation")
                      if not isinstance(artifact, dict):
                          continue
                      uri = artifact.get("uri")
                      coerced = coerce_uri(uri)
                      if uri != coerced or not isinstance(uri, str):
                          artifact["uri"] = coerced
                          fixes += 1

          with open(sarif_path, "w", encoding="utf-8") as fh:
              json.dump(sarif, fh, indent=2)
              fh.write("\n")

          print(f"SARIF validation complete; normalized {fixes} artifact URI value(s)")
          PY

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: ${{ env.EZ_APPSEC_SARIF }}
        continue-on-error: true

      - name: Upload scan results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ez-appsec-scan-${{ github.sha }}
          path: ${{ env.EZ_APPSEC_SARIF }}
          retention-days: 7
          if-no-files-found: warn

      - name: Generate dashboard vulnerabilities.json
        id: web-report
        run: |
          mkdir -p "${EZ_APPSEC_OUTPUT_DIR}"
          ez-appsec web-report . --output "${EZ_APPSEC_OUTPUT_DIR}"

      - name: Upload vulnerabilities.json as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ez-appsec-vulns-${{ github.sha }}
          path: ${{ env.EZ_APPSEC_OUTPUT_DIR }}/vulnerabilities.json
          retention-days: 7
          if-no-files-found: warn

      - name: Generate findings summary
        id: findings-summary
        if: always()
        run: |
          VULN_FILE="${EZ_APPSEC_OUTPUT_DIR}/vulnerabilities.json"
          if [ ! -f "${VULN_FILE}" ]; then
            echo "No vulnerabilities.json found" > /tmp/scan-summary.md
          else
            python3 - "${VULN_FILE}" > /tmp/scan-summary.md <<'PYEOF'
          import json, sys

          with open(sys.argv[1]) as f:
              data = json.load(f)
          findings = data if isinstance(data, list) else data.get("vulnerabilities", data.get("findings", []))

          def loc(item):
              l = item.get("location", {})
              fi = l.get("file", {}) if isinstance(l, dict) else {}
              fname = fi.get("file_name", "") if isinstance(fi, dict) else str(fi)
              fline = fi.get("line", l.get("start_line", "")) if isinstance(fi, dict) else ""
              return f"{fname}:{fline}" if fline else fname

          def scanner(item):
              sc = item.get("scanner", {})
              return sc.get("name", sc.get("id", "?")) if isinstance(sc, dict) else str(sc)

          by_sev = {"HIGH": [], "MEDIUM": [], "LOW": [], "INFO": []}
          for item in findings:
              sev = item.get("severity", "").upper()
              bucket = sev if sev in by_sev else "INFO"
              by_sev[bucket].append(item)

          # v2 trend: count new / resolved since the previous scan
          trends = {"new": 0, "unchanged": 0, "resolved": 0}
          for item in findings:
              t = (item.get("trend") or "unchanged").lower()
              if t in trends:
                  trends[t] += 1

          total = sum(len(v) for v in by_sev.values())
          lines = []
          lines.append(f"### Security Findings: {total} total")
          if trends["new"] or trends["resolved"]:
              trend_parts = []
              if trends["new"]:
                  trend_parts.append(f"**{trends['new']} new**")
              if trends["resolved"]:
                  trend_parts.append(f"**{trends['resolved']} resolved**")
              lines.append(f"_{' · '.join(trend_parts)} since last scan_")
          lines.append("")
          lines.append("| Severity | Count |")
          lines.append("|----------|-------|")
          for sev in ["HIGH", "MEDIUM", "LOW", "INFO"]:
              n = len(by_sev[sev])
              if n:
                  lines.append(f"| {sev} | {n} |")
          lines.append("")

          if by_sev["HIGH"]:
              lines.append("<details open><summary><strong>HIGH</strong></summary>")
              lines.append("")
              lines.append("| Scanner | Finding | Location |")
              lines.append("|---------|---------|----------|")
              for item in by_sev["HIGH"]:
                  msg = item.get("message", item.get("name", "")).replace("|", "\\|")[:100]
                  lines.append(f"| {scanner(item)} | {msg} | `{loc(item)}` |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          for sev in ["MEDIUM", "LOW"]:
              items = by_sev[sev]
              if not items:
                  continue
              lines.append(f"<details><summary><strong>{sev}</strong> ({len(items)})</summary>")
              lines.append("")
              lines.append("| Scanner | Finding | Location |")
              lines.append("|---------|---------|----------|")
              for item in items:
                  msg = item.get("message", item.get("name", "")).replace("|", "\\|")[:100]
                  lines.append(f"| {scanner(item)} | {msg} | `{loc(item)}` |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          print("\n".join(lines))
          PYEOF
          fi

      - name: Mint App token for dashboard push
        id: mint-token
        if: steps.web-report.outcome == 'success' && github.event_name != 'pull_request' && vars.EZ_APPSEC_DASHBOARD_REPO != ''
        env:
          _APP_ID: ${{ secrets.EZ_APPSEC_APP_ID }}
          _PRIVATE_KEY: ${{ secrets.EZ_APPSEC_PRIVATE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, time, json, urllib.request, urllib.error
          try:
              import jwt
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'PyJWT[crypto]', '-q'],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              import jwt

          app_id = os.environ.get('_APP_ID', '').strip()
          pem = os.environ.get('_PRIVATE_KEY', '').strip()

          if not app_id or not pem:
              print('App credentials not configured — skipping token mint')
              raise SystemExit(0)

          now = int(time.time())
          app_jwt = jwt.encode(
              {'iat': now - 60, 'exp': now + 600, 'iss': str(app_id)},
              pem, algorithm='RS256'
          )

          def gh(method, path, jwt_token):
              req = urllib.request.Request(
                  f'https://api.github.com{path}',
                  method=method,
                  headers={
                      'Authorization': f'Bearer {jwt_token}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'sourcebastion-scan/1.0',
                  }
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print(f'GitHub API error {e.code}: {e.read().decode()}', file=sys.stderr)
                  raise

          installs = gh('GET', '/app/installations', app_jwt)
          if not installs:
              print('No app installations found — skipping token mint')
              raise SystemExit(0)

          install_id = installs[0]['id']
          token_data = gh('POST', f'/app/installations/{install_id}/access_tokens', app_jwt)
          token = token_data['token']

          # Mask token in Actions logs, then write to GITHUB_ENV for downstream steps
          print(f'::add-mask::{token}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'_PUSH_TOKEN={token}\n')
          print('App token minted successfully')
          PYEOF
        continue-on-error: true

      - name: Push scan results to dashboard (update:vulns)
        if: steps.web-report.outcome == 'success' && github.event_name != 'pull_request'
        env:
          EZ_APPSEC_DASHBOARD_REPO: ${{ vars.EZ_APPSEC_DASHBOARD_REPO || 'ez-appsec/ez-appsec-dashboard' }}
        run: |
          if [ -z "${_PUSH_TOKEN}" ]; then
            echo "No push token available — skipping dashboard update."
            exit 0
          fi
          VULN_FILE="${EZ_APPSEC_OUTPUT_DIR}/vulnerabilities.json"
          if [ ! -f "${VULN_FILE}" ]; then
            echo "vulnerabilities.json not found — skipping dashboard update."
            exit 0
          fi

          # Derive destination path: data/vulnerabilities/[TEAM/]REPO_NAME.json
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TEAM="${{ vars.EZ_APPSEC_TEAM }}"
          VULN_REL="vulnerabilities/${TEAM:+${TEAM}/}${REPO_NAME}.json"
          SCAN_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Inject metadata into vulnerabilities.json so aggregate-index.py can read it
          export META_NAME="${{ github.event.repository.name }}" \
                 META_PATH="${{ github.repository }}" \
                 META_URL="https://github.com/${{ github.repository }}" \
                 META_DATE="${SCAN_DATE}"
          python3 - "${VULN_FILE}" > /tmp/vulns-with-meta.json <<'PYEOF'
          import json, sys, os
          data = json.load(open(sys.argv[1]))
          if isinstance(data, dict):
              data.setdefault("project_name", os.environ["META_NAME"])
              data.setdefault("project_path", os.environ["META_PATH"])
              data.setdefault("github_url",   os.environ["META_URL"])
              data.setdefault("scan_date",    os.environ["META_DATE"])
          print(json.dumps(data, indent=2))
          PYEOF

          DASH_DIR=$(mktemp -d)
          git clone "https://x-access-token:${_PUSH_TOKEN}@github.com/${EZ_APPSEC_DASHBOARD_REPO}.git" "${DASH_DIR}/dashboard"
          mkdir -p "${DASH_DIR}/dashboard/data/$(dirname ${VULN_REL})"
          cp /tmp/vulns-with-meta.json "${DASH_DIR}/dashboard/data/${VULN_REL}"

          # Regenerate index.json by fetching and running the aggregation script
          curl -sSfL "https://raw.githubusercontent.com/sourcebastion/sourcebastion-scanner/main/github/dashboard/aggregate-index.py" \
            -o /tmp/aggregate-index.py
          python3 /tmp/aggregate-index.py "${DASH_DIR}/dashboard/data"

          cd "${DASH_DIR}/dashboard"
          git config user.name "SourceBastion Scan"
          git config user.email "sourcebastionbot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update scan results for ${{ github.repository }}"
          git push origin main
          rm -rf "${DASH_DIR}"
          echo "Dashboard updated: https://github.com/${EZ_APPSEC_DASHBOARD_REPO}"

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && steps.scan.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const artifactUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const summaryPath = '/tmp/scan-summary.md';
            const summaryMd = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '';

            let body = `## 🔒 SourceBastion Scan\n\n`;
            body += summaryMd ? summaryMd + '\n' : '';
            body += `📊 [View full scan run](${artifactUrl})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && (
                comment.body.includes('🔒 SourceBastion Scan') ||
                comment.body.includes('🔒 ez-appsec Security Scan')
              )
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
