# Reviewed scanner release workflow.
# VERSION and CHANGELOG.md are updated through a pull request before dispatch.
# This is the only workflow allowed to publish container images.

name: Release

on:
  repository_dispatch:
    types: [scanner-release]
  workflow_dispatch:
    inputs:
      version:
        description: Existing VERSION value, prefixed with v (for example v1.7.31)
        required: true
        type: string
      break_glass_reason:
        description: Why the owner is bypassing bot initiation
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: scanner-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Approve and prepare release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      release_ready: ${{ steps.release_metadata.outputs.release_ready }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      release_sha: ${{ steps.release_metadata.outputs.release_sha }}
      release_exists: ${{ steps.release_metadata.outputs.release_exists }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate the requested immutable version
        id: release_metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch)
              if [ "$GITHUB_ACTOR" != "sourcebastion-bot[bot]" ]; then
                echo "automated releases must be initiated by sourcebastion-bot[bot]" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_ACTOR" != "jfelten" ]; then
                echo "break-glass releases are restricted to owner jfelten" >&2
                exit 1
              fi
              if [ "${#BREAK_GLASS_REASON}" -lt 12 ]; then
                echo "break-glass releases require a meaningful audit reason" >&2
                exit 1
              fi
              echo "::warning::owner break-glass release path selected"
              ;;
            *)
              echo "unsupported release event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact vMAJOR.MINOR.PATCH value" >&2
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$expected" ]; then
            echo "requested $REQUESTED_VERSION but VERSION declares $expected" >&2
            exit 1
          fi
          release_state="$(
            gh release view "$REQUESTED_VERSION" \
              --json isDraft,targetCommitish \
              --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null || true
          )"
          if [ -n "$release_state" ]; then
            IFS=$'\t' read -r is_draft target_commitish <<< "$release_state"
            if [ "$is_draft" != "true" ]; then
              echo "$REQUESTED_VERSION is already published; release tags are immutable" >&2
              exit 1
            fi
            if [ "$target_commitish" != "$GITHUB_SHA" ]; then
              echo "draft $REQUESTED_VERSION targets $target_commitish, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify --quiet "refs/tags/$REQUESTED_VERSION"; then
              echo "$REQUESTED_VERSION tag exists without a resumable draft release" >&2
              exit 1
            fi
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_version=${REQUESTED_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Create the draft release and immutable tag
        if: steps.release_metadata.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          VERSION="v${VERSION}"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --draft

  build-docker-standard:
    name: Build Standard Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}
            org.opencontainers.image.title=sourcebastion-scanner
            org.opencontainers.image.description=SourceBastion application security scanner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest standard image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-slim:
    name: Build Slim Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.slim
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}-slim
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}-slim
            org.opencontainers.image.title=sourcebastion-scanner-slim
            org.opencontainers.image.description=SourceBastion scanner (slim variant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest slim image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-micro:
    name: Build Micro Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push micro image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.micro
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}-micro
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}-micro
            org.opencontainers.image.title=sourcebastion-scanner-micro
            org.opencontainers.image.description=SourceBastion scanner (micro variant without semgrep)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest micro image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-thin:
    name: Build Thin Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push thin image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.thin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}-thin
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}-thin
            org.opencontainers.image.title=sourcebastion-scanner-thin
            org.opencontainers.image.description=SourceBastion scanner (thin variant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest thin image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-semgrep:
    name: Build Semgrep Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semgrep image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.semgrep
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-${{ github.run_id }}-${{ github.run_attempt }}-semgrep
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.release_version }}-semgrep
            org.opencontainers.image.title=sourcebastion-scanner-semgrep
            org.opencontainers.image.description=SourceBastion scanner (Semgrep-only variant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest semgrep image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-scan:
    name: Release Security Scan
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker-standard]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: write
      packages: read
      security-events: write
    outputs:
      findings-count: ${{ steps.count.outputs.findings-count }}
      critical-count: ${{ steps.count.outputs.critical-count }}
      high-count: ${{ steps.count.outputs.high-count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SourceBastion Scan via release image
        # Scan the exact staged digest before any public release tag moves.
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          mkdir -p scan-results
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            github-scan . --output scan-results/ez-appsec.sarif --severity medium

      - name: Generate vulnerabilities.json
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            web-report . --output scan-results

      - name: Count findings
        id: count
        run: |
          python3 - << 'PYEOF'
          import json, os

          sarif = json.load(open("scan-results/ez-appsec.sarif"))
          results = sarif["runs"][0]["results"]
          total = len(results)

          severity_map = {"error": "critical", "warning": "high", "note": "medium"}
          counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
          for r in results:
              level = r.get("level", "note")
              sev = severity_map.get(level, "low")
              counts[sev] = counts.get(sev, 0) + 1

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a") as f:
              f.write(f"findings-count={total}\n")
              f.write(f"critical-count={counts['critical']}\n")
              f.write(f"high-count={counts['high']}\n")

          print(f"Total: {total}  Critical: {counts['critical']}  High: {counts['high']}")
          PYEOF

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: scan-results/ez-appsec.sarif
          category: release-scan
        continue-on-error: true

      - name: Generate SBOM
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-standard.outputs.image_digest }}
        run: |
          scripts/run-scanner-container.sh "$RELEASE_IMAGE" \
            scan . --sbom --sbom-output scan-results/sbom.cdx.json \
              --severity medium --output scan-results/sbom-scan.json
          test -s scan-results/sbom.cdx.json

      - name: Upload scan artifacts to GitHub Release
        run: |
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          gh release upload "v${VERSION}" scan-results/ez-appsec.sarif --clobber
          if [ -f scan-results/vulnerabilities.json ]; then
            gh release upload "v${VERSION}" scan-results/vulnerabilities.json --clobber
          fi
          if [ -f scan-results/sbom.cdx.json ]; then
            gh release upload "v${VERSION}" scan-results/sbom.cdx.json --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-images:
    name: Promote validated image tags
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker-standard, build-docker-slim, build-docker-micro, build-docker-thin, build-docker-semgrep, release-scan]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested digests to public release tags
        env:
          VERSION: ${{ needs.prepare-release.outputs.release_version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          STANDARD_DIGEST: ${{ needs.build-docker-standard.outputs.image_digest }}
          SLIM_DIGEST: ${{ needs.build-docker-slim.outputs.image_digest }}
          MICRO_DIGEST: ${{ needs.build-docker-micro.outputs.image_digest }}
          THIN_DIGEST: ${{ needs.build-docker-thin.outputs.image_digest }}
          SEMGREP_DIGEST: ${{ needs.build-docker-semgrep.outputs.image_digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          for digest in \
            "$STANDARD_DIGEST" "$SLIM_DIGEST" "$MICRO_DIGEST" \
            "$THIN_DIGEST" "$SEMGREP_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "refusing to promote invalid image digest" >&2
              exit 1
            fi
          done

          docker buildx imagetools create \
            --tag "${image}:v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}" \
            --tag "${image}:latest" \
            "${image}@${STANDARD_DIGEST}"
          docker buildx imagetools create \
            --tag "${image}:slim-v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}-slim" \
            --tag "${image}:slim" \
            "${image}@${SLIM_DIGEST}"
          docker buildx imagetools create \
            --tag "${image}:micro-v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}-micro" \
            --tag "${image}:micro" \
            "${image}@${MICRO_DIGEST}"
          docker buildx imagetools create \
            --tag "${image}:thin-v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}-thin" \
            --tag "${image}:thin" \
            "${image}@${THIN_DIGEST}"
          docker buildx imagetools create \
            --tag "${image}:semgrep-v${VERSION}" \
            --tag "${image}:${RELEASE_SHA}-semgrep" \
            --tag "${image}:semgrep" \
            "${image}@${SEMGREP_DIGEST}"

  update-github-release:
    name: Update GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, promote-images, release-scan]
    if: needs.prepare-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub Release with Docker Info
        run: |
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          FINDINGS="${{ needs.release-scan.outputs.findings-count }}"
          CRITICAL="${{ needs.release-scan.outputs.critical-count }}"
          HIGH="${{ needs.release-scan.outputs.high-count }}"

          {
            echo "## Security Scan"
            echo ""
            echo "This release was scanned with SourceBastion Scan v${VERSION}."
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | ${CRITICAL} |"
            echo "| High     | ${HIGH} |"
            echo "| Total (medium+) | ${FINDINGS} |"
            echo ""
            echo "📊 Full results: [ez-appsec.sarif](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/ez-appsec.sarif) · [vulnerabilities.json](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/vulnerabilities.json)"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "| Variant | Tag |"
            echo "|---------|-----|"
            echo "| Standard (all scanners) | \`${REGISTRY}/${IMAGE_NAME}:v${VERSION}\` |"
            echo "| Standard (latest)      | \`${REGISTRY}/${IMAGE_NAME}:latest\` |"
            echo "| Slim                    | \`${REGISTRY}/${IMAGE_NAME}:slim-v${VERSION}\` |"
            echo "| Slim (latest)          | \`${REGISTRY}/${IMAGE_NAME}:slim\` |"
            echo "| Micro (no semgrep)      | \`${REGISTRY}/${IMAGE_NAME}:micro-v${VERSION}\` |"
            echo "| Micro (latest)          | \`${REGISTRY}/${IMAGE_NAME}:micro\` |"
            echo "| Thin                    | \`${REGISTRY}/${IMAGE_NAME}:thin-v${VERSION}\` |"
            echo "| Thin (latest)           | \`${REGISTRY}/${IMAGE_NAME}:thin\` |"
            echo "| Semgrep                 | \`${REGISTRY}/${IMAGE_NAME}:semgrep-v${VERSION}\` |"
            echo "| Semgrep (latest)        | \`${REGISTRY}/${IMAGE_NAME}:semgrep\` |"
            echo ""
            echo "### Quick Start"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
            echo "docker run --rm ${REGISTRY}/${IMAGE_NAME}:v${VERSION} --version"
            echo '```'
          } > /tmp/release_addendum.md

          # Fetch existing release notes then append
          gh release view "v${VERSION}" --json body -q .body > /tmp/existing_notes.md
          cat /tmp/existing_notes.md /tmp/release_addendum.md > /tmp/release_notes.md
          gh release edit "v${VERSION}" --notes-file /tmp/release_notes.md --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
