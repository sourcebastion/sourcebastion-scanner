# SourceBastion Scan scanning itself — dogfooding.
#
# Installs the compatibility CLI from source (no pre-built image needed) so every
# change to the scanner is immediately tested against the codebase itself.
# External scanners are installed directly on the runner.
#
# Results are uploaded to the GitHub Security tab (SARIF) and posted as a
# PR comment. On pushes to main, results are also pushed to the dashboard.

name: SourceBastion Self-Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OUTPUT_DIR: scan-results
  SARIF_FILE: scan-results/ez-appsec.sarif
  VULNS_FILE: scan-results/vulnerabilities.json

jobs:
  scan:
    name: Self-Scan
    runs-on: ubuntu-latest
    outputs:
      findings-count: ${{ steps.count.outputs.findings-count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Install SourceBastion from source
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
          cache: pip

      - name: Load validated scanner versions
        id: scanner-versions
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          pins = json.loads(Path(".github/scanner-versions.json").read_text())
          values = {
              "gitleaks_version": pins["gitleaks"]["version"],
              "gitleaks_x64_sha256": pins["gitleaks"]["linux_x64_sha256"],
              "grype_version": pins["grype"]["version"],
              "grype_amd64_sha256": pins["grype"]["linux_amd64_sha256"],
              "semgrep_version": pins["semgrep"]["version"],
              "kics_image": pins["kics"]["image"],
          }
          patterns = {
              "gitleaks_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "gitleaks_x64_sha256": r"[0-9a-f]{64}",
              "grype_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "grype_amd64_sha256": r"[0-9a-f]{64}",
              "semgrep_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "kics_image": r"checkmarx/kics@sha256:[0-9a-f]{64}",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  if not re.fullmatch(patterns[name], value):
                      raise SystemExit(f"invalid scanner pin: {name}")
                  print(f"{name}={value}", file=output)

      - name: Install SourceBastion
        run: pip install -e .

      # -----------------------------------------------------------------------
      # Install external scanners
      # -----------------------------------------------------------------------
      - name: Install gitleaks
        env:
          VERSION: v${{ steps.scanner-versions.outputs.gitleaks_version }}
          SHA256: ${{ steps.scanner-versions.outputs.gitleaks_x64_sha256 }}
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          rm /tmp/gitleaks.tar.gz /tmp/gitleaks
          gitleaks version

      - name: Install semgrep
        env:
          VERSION: ${{ steps.scanner-versions.outputs.semgrep_version }}
        run: |
          pip install "semgrep==${VERSION}"
          semgrep --version

      - name: Install KICS
        env:
          KICS_IMAGE: ${{ steps.scanner-versions.outputs.kics_image }}
        run: |
          docker pull "${KICS_IMAGE}"
          KICS_CONTAINER="$(docker create "${KICS_IMAGE}")"
          trap 'docker rm -f "${KICS_CONTAINER}" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/kics-assets
          docker cp "${KICS_CONTAINER}:/app/bin/kics" /tmp/kics
          docker cp "${KICS_CONTAINER}:/app/bin/assets/." /tmp/kics-assets
          sudo install -m 0755 /tmp/kics /usr/local/bin/kics
          sudo install -d /usr/local/bin/assets
          sudo cp -R /tmp/kics-assets/. /usr/local/bin/assets/
          docker rm "${KICS_CONTAINER}"
          trap - EXIT
          kics version

      - name: Install grype
        env:
          VERSION: ${{ steps.scanner-versions.outputs.grype_version }}
          SHA256: ${{ steps.scanner-versions.outputs.grype_amd64_sha256 }}
        run: |
          curl -sSfL "https://github.com/anchore/grype/releases/download/v${VERSION}/grype_${VERSION}_linux_amd64.tar.gz" \
            -o /tmp/grype.tar.gz
          echo "${SHA256}  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo install -m 0755 /tmp/grype /usr/local/bin/grype
          rm /tmp/grype.tar.gz /tmp/grype
          grype version

      - name: Scanner status
        run: sourcebastion status

      # -----------------------------------------------------------------------
      # Run scan
      # -----------------------------------------------------------------------
      - name: Run SourceBastion Scan (SARIF)
        id: scan
        run: |
          mkdir -p "${OUTPUT_DIR}"
          SEVERITY="${{ github.event_name == 'pull_request' && 'all' || 'medium' }}"
          echo "Severity: $SEVERITY"
          sourcebastion github-scan . --output "${SARIF_FILE}" --severity "$SEVERITY"
          ls -lh "${SARIF_FILE}"

      - name: Count findings
        id: count
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ['SARIF_FILE']))
          results = data.get('runs', [{}])[0].get('results', [])
          print(f"findings-count={len(results)}")
          PY
          echo "Findings: $(awk -F= '/^findings-count=/{print $2}' "$GITHUB_OUTPUT")"

      - name: Summarize vulnerabilities (severity + trend)
        id: summarize
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from collections import Counter
          path = os.environ['VULNS_FILE']
          try:
              data = json.load(open(path))
          except (FileNotFoundError, json.JSONDecodeError):
              print("summary-json={}")
              raise SystemExit(0)
          vulns = data.get('vulnerabilities', []) if isinstance(data, dict) else data
          sev = Counter((v.get('severity') or 'unknown').lower() for v in vulns)
          trends = Counter((v.get('trend') or 'unchanged').lower() for v in vulns)
          summary = {
              'total': len(vulns),
              'critical': sev.get('critical', 0),
              'high': sev.get('high', 0),
              'medium': sev.get('medium', 0),
              'low': sev.get('low', 0),
              'info': sev.get('info', 0),
              'new': trends.get('new', 0),
              'unchanged': trends.get('unchanged', 0),
              'resolved': trends.get('resolved', 0),
          }
          import json as _j
          print(f"summary-json={_j.dumps(summary)}")
          PY
        env:
          VULNS_FILE: ${{ env.OUTPUT_DIR }}/vulnerabilities.json

      - name: Generate vulnerabilities.json
        id: findings-report
        run: sourcebastion gitlab-scan . --output "${OUTPUT_DIR}/vulnerabilities.json"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Upload results
      # -----------------------------------------------------------------------
      - name: Upload SARIF to GitHub Security tab
        # A trusted post-scan job performs the upload. The scan job stays
        # read-only when it executes pull-request source.
        if: ${{ false }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ env.SARIF_FILE }}
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ez-appsec-self-scan-${{ github.sha }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push to dashboard (main branch only)
      # -----------------------------------------------------------------------
      - name: Comment on PR
        # PR write-back is handled by pr-scan-writeback.yml, which never
        # checks out or executes pull-request source.
        if: ${{ false }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // v2 summary: severity breakdown + new/resolved trend from vulnerabilities.json
            let summary = null;
            const raw = '${{ steps.summarize.outputs.summary-json }}';
            if (raw) {
              try { summary = JSON.parse(raw); } catch (e) { summary = null; }
            }

            const SEV_META = {
              critical: { icon: '🔴', label: 'Critical' },
              high:     { icon: '🟠', label: 'High' },
              medium:   { icon: '🟡', label: 'Medium' },
              low:      { icon: '🔵', label: 'Low' },
              info:     { icon: '⚪', label: 'Info' },
            };

            let body = `## 🔒 SourceBastion Self-Scan Results\n\n`;
            body += `| Scanner | Status |\n|---------|--------|\n`;
            body += `| gitleaks | ✓ secrets detection |\n`;
            body += `| semgrep  | ✓ SAST |\n`;
            body += `| grype    | ✓ dependency CVEs |\n\n`;

            if (summary) {
              const total = summary.total || 0;
              const rows = ['critical', 'high', 'medium', 'low', 'info']
                .map(s => {
                  const meta = SEV_META[s];
                  const c = summary[s] || 0;
                  return c > 0 ? `| ${meta.icon} ${meta.label} | ${c} |` : null;
                })
                .filter(Boolean)
                .join('\n');
              if (rows) {
                body += `| Severity | Count |\n|----------|-------|\n${rows}\n\n`;
              } else {
                body += `**Total findings:** ${total}\n\n`;
              }
              const trendParts = [];
              if (summary.new) trendParts.push(`**${summary.new} new**`);
              if (summary.resolved) trendParts.push(`**${summary.resolved} resolved**`);
              if (trendParts.length) {
                body += `${trendParts.join(' · ')} since last scan\n\n`;
              } else if (total === 0) {
                body += `✅ No findings\n\n`;
              }
            } else {
              const count = '${{ steps.count.outputs.findings-count }}';
              body += `**Total findings:** ${count}\n\n`;
            }

            body += `📊 [View full results and artifacts](${runUrl})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && (
                c.body.includes('SourceBastion Self-Scan Results') ||
                c.body.includes('SourceBastion Self-Scan Results')
              )
            );
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }

  publish-sarif:
    name: Publish Self-Scan SARIF
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [scan]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download scan result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ez-appsec-self-scan-${{ github.sha }}
          path: scan-results

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: scan-results/ez-appsec.sarif
