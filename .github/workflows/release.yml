# Reviewed scanner release workflow.
# VERSION and CHANGELOG.md are updated through a pull request before dispatch.
# This is the only workflow allowed to publish container images.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing VERSION value, prefixed with v (for example v1.7.31)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: scanner-release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Approve and prepare release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
      release_sha: ${{ steps.semantic_release.outputs.release_sha }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate the requested immutable version
        id: semantic_release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact vMAJOR.MINOR.PATCH value" >&2
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$expected" ]; then
            echo "requested $REQUESTED_VERSION but VERSION declares $expected" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$REQUESTED_VERSION"; then
            echo "$REQUESTED_VERSION already exists; release tags are immutable" >&2
            exit 1
          fi
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          echo "new_release_version=${REQUESTED_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Create the draft release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --draft

  build-docker-standard:
    name: Build Standard Docker Image
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.semantic-release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.release_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.new_release_version }}
            org.opencontainers.image.title=ez-appsec
            org.opencontainers.image.description=AI-powered application security scanning
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest standard image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-slim:
    name: Build Slim Docker Image
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.slim
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:slim-v${{ needs.semantic-release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.release_sha }}-slim
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:slim
          labels: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.new_release_version }}-slim
            org.opencontainers.image.title=ez-appsec-slim
            org.opencontainers.image.description=AI-powered application security scanning (slim variant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest slim image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-micro:
    name: Build Micro Docker Image
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push micro image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.micro
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro-v${{ needs.semantic-release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.release_sha }}-micro
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro
          labels: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.new_release_version }}-micro
            org.opencontainers.image.title=ez-appsec-micro
            org.opencontainers.image.description=AI-powered application security scanning (micro variant without semgrep)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest micro image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-thin:
    name: Build Thin Docker Image
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push thin image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.thin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:thin-v${{ needs.semantic-release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.release_sha }}-thin
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:thin
          labels: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.new_release_version }}-thin
            org.opencontainers.image.title=sourcebastion-scanner-thin
            org.opencontainers.image.description=SourceBastion scanner (thin variant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest thin image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-docker-semgrep:
    name: Build Semgrep Docker Image
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semgrep image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/Dockerfile.semgrep
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:semgrep-v${{ needs.semantic-release.outputs.new_release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.release_sha }}-semgrep
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:semgrep
          labels: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.new_release_version }}-semgrep
            org.opencontainers.image.title=ez-appsec-semgrep
            org.opencontainers.image.description=Semgrep-only container for ez-appsec
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest semgrep image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-scan:
    name: Release Security Scan
    runs-on: ubuntu-latest
    needs: [semantic-release, build-docker-standard]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      packages: read
      security-events: write
    outputs:
      findings-count: ${{ steps.count.outputs.findings-count }}
      critical-count: ${{ steps.count.outputs.critical-count }}
      high-count: ${{ steps.count.outputs.high-count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.semantic-release.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ez-appsec scan via release image
        # Scans with the exact image that was just published — validates the
        # image works AND produces the official security posture for this release.
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          mkdir -p scan-results
          docker run --rm \
            -v "$(pwd):/scan" \
            -w /scan \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION} \
            github-scan . --output scan-results/ez-appsec.sarif --severity medium

      - name: Generate vulnerabilities.json
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          docker run --rm \
            -v "$(pwd):/scan" \
            -w /scan \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION} \
            web-report . --output scan-results

      - name: Count findings
        id: count
        run: |
          python3 - << 'PYEOF'
          import json, os

          sarif = json.load(open("scan-results/ez-appsec.sarif"))
          results = sarif["runs"][0]["results"]
          total = len(results)

          severity_map = {"error": "critical", "warning": "high", "note": "medium"}
          counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
          for r in results:
              level = r.get("level", "note")
              sev = severity_map.get(level, "low")
              counts[sev] = counts.get(sev, 0) + 1

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a") as f:
              f.write(f"findings-count={total}\n")
              f.write(f"critical-count={counts['critical']}\n")
              f.write(f"high-count={counts['high']}\n")

          print(f"Total: {total}  Critical: {counts['critical']}  High: {counts['high']}")
          PYEOF

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: scan-results/ez-appsec.sarif
          category: release-scan
        continue-on-error: true

      - name: Generate SBOM
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          docker run --rm \
            -v "$(pwd):/scan" \
            -w /scan \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION} \
            scan . --sbom --sbom-output scan-results/sbom.cdx.json --severity medium --output /dev/null
        continue-on-error: true

      - name: Upload scan artifacts to GitHub Release
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          gh release upload "v${VERSION}" scan-results/ez-appsec.sarif --clobber
          if [ -f scan-results/vulnerabilities.json ]; then
            gh release upload "v${VERSION}" scan-results/vulnerabilities.json --clobber
          fi
          if [ -f scan-results/sbom.cdx.json ]; then
            gh release upload "v${VERSION}" scan-results/sbom.cdx.json --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-github-release:
    name: Update GitHub Release
    runs-on: ubuntu-latest
    needs: [semantic-release, build-docker-standard, build-docker-slim, build-docker-micro, build-docker-thin, build-docker-semgrep, release-scan]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub Release with Docker Info
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          FINDINGS="${{ needs.release-scan.outputs.findings-count }}"
          CRITICAL="${{ needs.release-scan.outputs.critical-count }}"
          HIGH="${{ needs.release-scan.outputs.high-count }}"

          {
            echo "## Security Scan"
            echo ""
            echo "This release was scanned with ez-appsec v${VERSION}."
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | ${CRITICAL} |"
            echo "| High     | ${HIGH} |"
            echo "| Total (medium+) | ${FINDINGS} |"
            echo ""
            echo "📊 Full results: [ez-appsec.sarif](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/ez-appsec.sarif) · [vulnerabilities.json](https://github.com/${IMAGE_NAME}/releases/download/v${VERSION}/vulnerabilities.json)"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "| Variant | Tag |"
            echo "|---------|-----|"
            echo "| Standard (all scanners) | \`${REGISTRY}/${IMAGE_NAME}:v${VERSION}\` |"
            echo "| Standard (latest)      | \`${REGISTRY}/${IMAGE_NAME}:latest\` |"
            echo "| Slim                    | \`${REGISTRY}/${IMAGE_NAME}:slim-v${VERSION}\` |"
            echo "| Slim (latest)          | \`${REGISTRY}/${IMAGE_NAME}:slim\` |"
            echo "| Micro (no semgrep)      | \`${REGISTRY}/${IMAGE_NAME}:micro-v${VERSION}\` |"
            echo "| Micro (latest)          | \`${REGISTRY}/${IMAGE_NAME}:micro\` |"
            echo "| Thin                    | \`${REGISTRY}/${IMAGE_NAME}:thin-v${VERSION}\` |"
            echo "| Thin (latest)           | \`${REGISTRY}/${IMAGE_NAME}:thin\` |"
            echo "| Semgrep                 | \`${REGISTRY}/${IMAGE_NAME}:semgrep-v${VERSION}\` |"
            echo "| Semgrep (latest)        | \`${REGISTRY}/${IMAGE_NAME}:semgrep\` |"
            echo ""
            echo "### Quick Start"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
            echo "docker run --rm ${REGISTRY}/${IMAGE_NAME}:v${VERSION} --version"
            echo '```'
          } > /tmp/release_addendum.md

          # Fetch existing release notes then append
          gh release view "v${VERSION}" --json body -q .body > /tmp/existing_notes.md
          cat /tmp/existing_notes.md /tmp/release_addendum.md > /tmp/release_notes.md
          gh release edit "v${VERSION}" --notes-file /tmp/release_notes.md --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
