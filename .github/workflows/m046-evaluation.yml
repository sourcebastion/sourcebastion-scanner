name: M046 Native Inventory Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - evaluation/m046/**
      - tests/test_m046_inventory_eval.py
      - tests/test_m046_benchmark.py
      - .github/workflows/m046-evaluation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Inventory candidates (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Prepare trusted host diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y strace
          python -m pip install pytest==8.3.5
          mkdir -p "$RUNNER_TEMP/m046-host"
          uname -a > "$RUNNER_TEMP/m046-host/uname.txt"
          strace --version > "$RUNNER_TEMP/m046-host/strace.txt"
          # Ephemeral hosted runner only. Namespace support is required;
          # a failure never downgrades to an online/unjailled candidate scan.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Urnmpf --kill-child=KILL true
      - name: Verify and prepare native candidate tools
        run: python -m evaluation.m046.prepare --output "$RUNNER_TEMP/m046-tools"
      - name: Prove namespace boundaries and supervisor cancellation
        env:
          M046_STRACE: /usr/bin/strace
        run: python -m pytest tests/test_m046_inventory_eval.py -q --junitxml="$RUNNER_TEMP/m046-host/native-tests.xml"
      - name: Evaluate every candidate offline
        run: |
          python -m evaluation.m046.native --manifest "$RUNNER_TEMP/m046-tools/manifest.json" \
            --strace /usr/bin/strace --output "$RUNNER_TEMP/m046-evidence" --repeat 2
      - name: Package raw evidence without following adversarial links
        if: always()
        run: |
          python -m evaluation.m046.pack_evidence \
            --root "host=$RUNNER_TEMP/m046-host" \
            --root "tool-manifest=$RUNNER_TEMP/m046-tools/manifest.json" \
            --root "prepared-manifest=$RUNNER_TEMP/m046-tools/prepared-manifest.json" \
            --root "evidence=$RUNNER_TEMP/m046-evidence" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --output "$RUNNER_TEMP/m046-native.tar.gz"
      - name: Retain raw native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m046-native-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-native.tar.gz
            ${{ runner.temp }}/m046-native.tar.gz.sha256
          retention-days: 7

  performance:
    name: Candidate resources (${{ matrix.engine }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [syft, cdxgen, scalibr]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Prepare only the selected native candidate
        run: python -m evaluation.m046.prepare --output "$RUNNER_TEMP/m046-tools" --engine "${{ matrix.engine }}"
      - name: Measure independent package boundaries without tracing
        run: |
          python -m evaluation.m046.benchmark --manifest "$RUNNER_TEMP/m046-tools/manifest.json" \
            --output "$RUNNER_TEMP/m046-performance" --engine "${{ matrix.engine }}" --repeat 3 \
            --fixture pins-1000-1-roots --fixture pins-10000-10-roots \
            --fixture pins-100000-100-roots --fixture pins-100001-100-roots
      - name: Package raw candidate resource evidence
        if: always()
        run: |
          python -m evaluation.m046.pack_evidence \
            --root "performance=$RUNNER_TEMP/m046-performance" \
            --root "manifest=$RUNNER_TEMP/m046-tools/manifest.json" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --output "$RUNNER_TEMP/m046-performance.tar.gz"
      - name: Retain candidate resource measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m046-performance-${{ matrix.engine }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-performance.tar.gz
            ${{ runner.temp }}/m046-performance.tar.gz.sha256
          retention-days: 7

  docker-proofs:
    name: Resource harness proofs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Prove bounded capture and native executable checks
        run: |
          python -m pip install pytest==8.3.5
          mkdir -p "$RUNNER_TEMP/m046-docker-host"
          python -m pytest tests/test_m046_benchmark.py -q --junitxml="$RUNNER_TEMP/m046-docker-host/tests.xml"
          uname -a > "$RUNNER_TEMP/m046-docker-host/uname.txt"
          docker --host unix:///var/run/docker.sock version > "$RUNNER_TEMP/m046-docker-host/docker.txt"
      - name: Prepare pinned native controller runtime
        run: |
          python -c 'import platform; from evaluation.m046.benchmark import docker,IMAGE; docker("pull","--platform","linux/"+{"x86_64":"amd64","aarch64":"arm64"}[platform.machine()],IMAGE)'
      - name: Prove kernel limits, capabilities, output isolation and cancellation
        run: python -m evaluation.m046.docker_proofs --output "$RUNNER_TEMP/m046-docker-proofs"
      - name: Package raw controller and candidate evidence
        if: always()
        run: |
          python -m evaluation.m046.pack_evidence \
            --root "host=$RUNNER_TEMP/m046-docker-host" \
            --root "proofs=$RUNNER_TEMP/m046-docker-proofs" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --root "tests=$GITHUB_WORKSPACE/tests/test_m046_benchmark.py" \
            --output "$RUNNER_TEMP/m046-docker-proofs.tar.gz"
      - name: Retain native harness proofs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m046-docker-proofs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-docker-proofs.tar.gz
            ${{ runner.temp }}/m046-docker-proofs.tar.gz.sha256
          retention-days: 7
