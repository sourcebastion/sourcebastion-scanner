<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">SourceBastion autonomous open-source maintenance</title>
  <desc id="description">A human-governed maintenance agent checks scanner releases, Dependabot pull requests, and project issues, prepares changes in an isolated Z.AI workspace, and sends them through GitHub App identity, security CI, bounded review, and protected release approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c6b3"/>
      <stop offset="1" stop-color="#2388ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#73e8dc"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #73e8dc; font-size: 22px; font-weight: 700; letter-spacing: 4px; }
      .title { fill: #f8fbff; font-size: 56px; font-weight: 750; }
      .subtitle { fill: #b8c9dc; font-size: 24px; }
      .box-title { fill: #f8fbff; font-size: 25px; font-weight: 700; }
      .box-copy { fill: #bfd0e3; font-size: 18px; }
      .small { fill: #99aec6; font-size: 16px; }
      .label { fill: #07111f; font-size: 18px; font-weight: 800; }
      .flow { fill: none; stroke: #73e8dc; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1420" cy="100" r="260" fill="#2388ff" opacity="0.08"/>
  <circle cx="120" cy="880" r="300" fill="#19c6b3" opacity="0.06"/>

  <text x="80" y="80" class="eyebrow">SOURCEBASTION</text>
  <text x="80" y="145" class="title">Autonomous maintenance.</text>
  <text x="80" y="205" class="title">Human security judgment.</text>
  <text x="80" y="250" class="subtitle">A production workflow for keeping an open-source security scanner current, tested, and accountable.</text>

  <rect x="80" y="315" width="360" height="132" rx="24" fill="#122c44" stroke="#31516d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="102" y="337" width="98" height="30" rx="15" fill="#73e8dc"/>
  <text x="151" y="358" class="label" text-anchor="middle">DAILY</text>
  <text x="102" y="398" class="box-title">Scanner releases</text>
  <text x="102" y="428" class="box-copy">3-day maturity + immutable integrity</text>

  <rect x="80" y="477" width="360" height="132" rx="24" fill="#122c44" stroke="#31516d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="102" y="499" width="118" height="30" rx="15" fill="#73e8dc"/>
  <text x="161" y="520" class="label" text-anchor="middle">WEEKLY</text>
  <text x="102" y="560" class="box-title">Dependabot updates</text>
  <text x="102" y="590" class="box-copy">2-day soak · zero-day override</text>

  <rect x="80" y="639" width="360" height="132" rx="24" fill="#122c44" stroke="#31516d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="102" y="661" width="98" height="30" rx="15" fill="#73e8dc"/>
  <text x="151" y="682" class="label" text-anchor="middle">DAILY</text>
  <text x="102" y="722" class="box-title">Community issues</text>
  <text x="102" y="752" class="box-copy">Acknowledge · assess · propose</text>

  <path d="M440 381 H520 V520 H575" class="flow"/>
  <path d="M440 543 H575" class="flow"/>
  <path d="M440 705 H520 V566 H575" class="flow"/>

  <rect x="575" y="342" width="450" height="395" rx="32" fill="#0c2136" stroke="#73e8dc" stroke-width="3" filter="url(#shadow)"/>
  <rect x="615" y="375" width="370" height="68" rx="18" fill="url(#agent)"/>
  <text x="800" y="418" class="box-title" text-anchor="middle">sourcebastion-bot</text>
  <text x="615" y="486" class="eyebrow" style="font-size:17px;letter-spacing:2px">BOUNDED OPS AGENT</text>

  <circle cx="640" cy="535" r="7" fill="#73e8dc"/>
  <text x="662" y="542" class="box-copy">Unprivileged ops identity</text>
  <circle cx="640" cy="582" r="7" fill="#73e8dc"/>
  <text x="662" y="589" class="box-copy">Z.AI is the only LLM provider</text>
  <circle cx="640" cy="629" r="7" fill="#73e8dc"/>
  <text x="662" y="636" class="box-copy">Bubblewrap-isolated workspace</text>
  <circle cx="640" cy="676" r="7" fill="#73e8dc"/>
  <text x="662" y="683" class="box-copy">Maximum 3 review/fix cycles</text>
  <text x="800" y="716" class="small" text-anchor="middle">No LLM or provider credential exists in the scanner runtime.</text>

  <path d="M1025 540 H1095" class="flow"/>

  <rect x="1095" y="315" width="425" height="456" rx="28" fill="#122c44" stroke="#31516d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="365" class="eyebrow" style="font-size:17px;letter-spacing:2px">CONTROLLED DELIVERY</text>

  <rect x="1135" y="398" width="345" height="72" rx="18" fill="#173752"/>
  <text x="1160" y="429" class="box-title">1 · Open one PR</text>
  <text x="1160" y="455" class="small">Short-lived GitHub App credential</text>

  <rect x="1135" y="489" width="345" height="72" rx="18" fill="#173752"/>
  <text x="1160" y="520" class="box-title">2 · Prove it in CI</text>
  <text x="1160" y="546" class="small">Tests · scans · SBOM · provenance</text>

  <rect x="1135" y="580" width="345" height="72" rx="18" fill="#173752"/>
  <text x="1160" y="611" class="box-title">3 · Risk-based gate</text>
  <text x="1160" y="637" class="small">Low risk auto-merge · else human</text>

  <rect x="1135" y="671" width="345" height="72" rx="18" fill="#173752"/>
  <text x="1160" y="702" class="box-title">4 · Protected release</text>
  <text x="1160" y="728" class="small">Bot dispatch · owner approval</text>

  <rect x="80" y="838" width="1440" height="100" rx="24" fill="#081827" stroke="#31516d" stroke-width="2"/>
  <text x="115" y="878" class="eyebrow" style="font-size:17px;letter-spacing:2px">FAIL-CLOSED SAFETY RAILS</text>
  <text x="115" y="915" class="box-copy">Untrusted issue text never becomes authority</text>
  <text x="575" y="915" class="box-copy">Missing evidence leaves work open</text>
  <text x="1025" y="915" class="box-copy">Humans own exceptions and releases</text>
</svg>
