# SourceBastion Scan — customer workflow template
# Provisioned automatically when you install the SourceBastion GitHub App.

name: SourceBastion Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to Security tab
  actions: read
  pull-requests: write   # Required for PR comments
  packages: read         # Required to pull the SourceBastion Scan image

env:
  SOURCEBASTION_OUTPUT_DIR: "scan-results"
  SOURCEBASTION_SARIF: "scan-results/ez-appsec.sarif"

jobs:
  # Advisory: check if a newer SourceBastion Scan version is available. Never blocks the scan.
  version-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for newer SourceBastion Scan release
        run: |
          LATEST=$(curl -sSf \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: sourcebastion-scan-version-check/1.0" \
            https://api.github.com/repos/sourcebastion/sourcebastion-scanner/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          CURRENT="${{ vars.SOURCEBASTION_VERSION || 'latest' }}"
          if [ "$CURRENT" = "latest" ]; then
            echo "::warning::SourceBastion Scan: using 'latest' image tag. Pin SOURCEBASTION_VERSION to a specific version for reproducible scans. Current release: ${LATEST}"
          elif [ "$CURRENT" != "$LATEST" ]; then
            echo "::warning::SourceBastion Scan ${CURRENT} is outdated. Latest release: ${LATEST}. Update the SOURCEBASTION_VERSION variable."
          else
            echo "SourceBastion Scan ${CURRENT} is up to date."
          fi

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sourcebastion/sourcebastion-scanner:latest
      options: --user root --entrypoint ""

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run SourceBastion Scan
        id: scan
        run: |
          echo "Running SourceBastion Scan..."
          mkdir -p "${SOURCEBASTION_OUTPUT_DIR}"

          echo "Checking SourceBastion Scan status..."
          sourcebastion status || true

          echo "Starting GitHub SARIF scan..."
          # Use 'all' severity for PRs, 'medium' for main branch
          SEVERITY="${{ github.event_name == 'pull_request' && 'all' || 'medium' }}"
          echo "Severity level: $SEVERITY"
          sourcebastion github-scan . --output "${SOURCEBASTION_SARIF}" --severity "$SEVERITY"

          echo "Scan completed. Checking for output file..."
          if [ -f "${SOURCEBASTION_SARIF}" ]; then
            echo "SARIF file created successfully"
            ls -lh "${SOURCEBASTION_SARIF}"
          else
            echo "ERROR: SARIF file not created at ${SOURCEBASTION_SARIF}"
            exit 1
          fi

      - name: Count findings
        id: summary
        run: |
          if [ -f "${SOURCEBASTION_SARIF}" ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('${SOURCEBASTION_SARIF}'))['runs'][0]['results']))")
            echo "findings-count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT security findings"
          else
            echo "findings-count=0" >> $GITHUB_OUTPUT
            echo "No findings found"
          fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ env.SOURCEBASTION_SARIF }}
        continue-on-error: true

      - name: Upload scan results as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ez-appsec-scan-${{ github.sha }}
          path: ${{ env.SOURCEBASTION_SARIF }}
          retention-days: 7
          if-no-files-found: warn

      - name: Generate the findings report
        id: findings-report
        # `gitlab-scan` writes the same document `web-report` did -- both
        # called `scan_to_gitlab_format` -- so this is a rename, not a
        # behaviour change. The findings summary below reads the file.
        run: |
          mkdir -p "${SOURCEBASTION_OUTPUT_DIR}"
          sourcebastion gitlab-scan . --output "${SOURCEBASTION_OUTPUT_DIR}/vulnerabilities.json"

      - name: Upload vulnerabilities.json as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ez-appsec-vulns-${{ github.sha }}
          path: ${{ env.SOURCEBASTION_OUTPUT_DIR }}/vulnerabilities.json
          retention-days: 7
          if-no-files-found: warn

      - name: Generate findings summary
        id: findings-summary
        if: always()
        run: |
          VULN_FILE="${SOURCEBASTION_OUTPUT_DIR}/vulnerabilities.json"
          if [ ! -f "${VULN_FILE}" ]; then
            echo "No vulnerabilities.json found" > /tmp/scan-summary.md
          else
            python3 - "${VULN_FILE}" > /tmp/scan-summary.md <<'PYEOF'
          import json, sys

          with open(sys.argv[1]) as f:
              data = json.load(f)
          findings = data if isinstance(data, list) else data.get("vulnerabilities", data.get("findings", []))

          def loc(item):
              l = item.get("location", {})
              fi = l.get("file", {}) if isinstance(l, dict) else {}
              fname = fi.get("file_name", "") if isinstance(fi, dict) else str(fi)
              fline = fi.get("line", l.get("start_line", "")) if isinstance(fi, dict) else ""
              return f"{fname}:{fline}" if fline else fname

          def scanner(item):
              sc = item.get("scanner", {})
              return sc.get("name", sc.get("id", "?")) if isinstance(sc, dict) else str(sc)

          by_sev = {"HIGH": [], "MEDIUM": [], "LOW": [], "INFO": []}
          for item in findings:
              sev = item.get("severity", "").upper()
              bucket = sev if sev in by_sev else "INFO"
              by_sev[bucket].append(item)

          total = sum(len(v) for v in by_sev.values())
          lines = []
          lines.append(f"### Security Findings: {total} total")
          lines.append("")
          lines.append("| Severity | Count |")
          lines.append("|----------|-------|")
          for sev in ["HIGH", "MEDIUM", "LOW", "INFO"]:
              n = len(by_sev[sev])
              if n:
                  lines.append(f"| {sev} | {n} |")
          lines.append("")

          if by_sev["HIGH"]:
              lines.append("<details open><summary><strong>HIGH</strong></summary>")
              lines.append("")
              lines.append("| Scanner | Finding | Location |")
              lines.append("|---------|---------|----------|")
              for item in by_sev["HIGH"]:
                  msg = item.get("message", item.get("name", "")).replace("|", "\\|")[:100]
                  lines.append(f"| {scanner(item)} | {msg} | `{loc(item)}` |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          for sev in ["MEDIUM", "LOW"]:
              items = by_sev[sev]
              if not items:
                  continue
              lines.append(f"<details><summary><strong>{sev}</strong> ({len(items)})</summary>")
              lines.append("")
              lines.append("| Scanner | Finding | Location |")
              lines.append("|---------|---------|----------|")
              for item in items:
                  msg = item.get("message", item.get("name", "")).replace("|", "\\|")[:100]
                  lines.append(f"| {scanner(item)} | {msg} | `{loc(item)}` |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          print("\n".join(lines))
          PYEOF
          fi

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && steps.scan.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const artifactUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const summaryPath = '/tmp/scan-summary.md';
            const summaryMd = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '';

            let body = `## 🔒 SourceBastion Scan\n\n`;
            body += summaryMd ? summaryMd + '\n' : '';
            body += `📊 [View full scan run](${artifactUrl})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('🔒 SourceBastion Scan') ||
               comment.body.includes('🔒 SourceBastion Security Scan'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
