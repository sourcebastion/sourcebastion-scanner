name: PR Scan Write-Back

on:
  workflow_run:
    workflows:
      - SourceBastion Scan
      - SourceBastion Self-Scan
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Report scan completion
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update pull-request status comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const pull = run.pull_requests?.[0];
            if (!pull) {
              core.notice('No pull request is associated with this workflow run.');
              return;
            }

            const marker = `<!-- sourcebastion-pr-scan:${run.name} -->`;
            const icon = run.conclusion === 'success' ? '✅' : '⚠️';
            const body = [
              marker,
              `## ${icon} ${run.name}`,
              '',
              `The read-only scan completed with **${run.conclusion}**.`,
              `[View the trusted workflow result](${run.html_url}).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body,
              });
            }
