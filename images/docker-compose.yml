services:
  sourcebastion:
    build:
      context: ..
      dockerfile: images/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?Set PYTHON_VERSION from the reviewed pin file}
    image: sourcebastion:local
    volumes:
      - ${SCAN_DIR:-..}:/scan
    command: scan /scan --output /scan/scan-results/report.json
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
