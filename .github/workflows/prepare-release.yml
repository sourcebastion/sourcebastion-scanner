name: Prepare reviewed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: auto selects next patch; optional MAJOR.MINOR.PATCH override
        default: auto
        required: false
        type: string
      python_version:
        description: Python minor, exact patch, or latest compatible stable
        default: '3.14'
        required: false
        type: string
      release_notes:
        description: Optional notes; empty generates notes from merged changes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-scanner-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: scanner-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the next scanner release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'auto' }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/prepare_release.py --resolve-version "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Install reviewed release preparation tools
        run: python -m pip install pypi-attestations==0.0.30 uv==0.11.0 packaging==26.3
      - name: Refresh Python and both architecture dependency locks
        env:
          REQUESTED_PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}
        run: python scripts/python_version.py update --version "$REQUESTED_PYTHON_VERSION"
      - name: Mint repository-scoped bot token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SOURCEBASTION_BOT_APP_ID }}
          private-key: ${{ secrets.SOURCEBASTION_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Generate release notes from merged changes
        if: inputs.release_notes == ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous_tag=$(gh release view --json tagName --jq .tagName)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=v${RELEASE_VERSION}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "previous_tag_name=${previous_tag}" \
            --jq .body > "$RUNNER_TEMP/generated-release-notes.md"
      - name: Prepare scanner version and changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python scripts/prepare_release.py --notes-file "$RUNNER_TEMP/generated-release-notes.md"
      - name: Open release PR for review and native image validation
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v${RELEASE_VERSION}"
          existing=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Release PR #${existing} is already open; leaving its reviewed contents unchanged."
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'sourcebastion-bot[bot]'
          git config user.email '327642096+sourcebastion-bot[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md PYTHON_VERSION images/Dockerfile .github/python-locks \
            .github/base-image-pins.json .github/inventory-runtime-pins.json
          git commit -m "chore(release): prepare v${RELEASE_VERSION}"
          git -c credential.helper='!gh auth git-credential' push origin "$branch"
          python_version=$(python scripts/python_version.py current)
          printf 'Release v%s with Python %s. Python wheels and dependency closure are verified for AMD64 and ARM64. Native Docker builds, scanner tests and human review must pass before merge.\n' \
            "$RELEASE_VERSION" "$python_version" > "$RUNNER_TEMP/release-pr.md"
          gh pr create --base main --head "$branch" --title "chore(release): prepare v${RELEASE_VERSION}" \
            --body-file "$RUNNER_TEMP/release-pr.md"
