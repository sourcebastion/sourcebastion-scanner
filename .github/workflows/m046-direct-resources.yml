name: M046 Direct Inventory Resources

on:
  pull_request:
    paths:
      - evaluation/m046/**
      - tests/test_m046_direct_resources.py
      - tests/test_m046_benchmark.py
      - tests/test_m046_syft_controls.py
      - PYTHON_VERSION
      - .github/workflows/m046-direct-resources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: Direct resource harness proofs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r evaluation/m046/requirements-static.txt -r evaluation/m046/requirements-export.txt
          python -m pip install pytest==8.3.5
          python -m pytest tests/test_m046_direct_resources.py tests/test_m046_benchmark.py tests/test_m046_syft_controls.py -q --junitxml="$RUNNER_TEMP/m046-direct-tests.xml"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc
          python -c 'import platform; from evaluation.m046.benchmark import docker,IMAGE; docker("pull","--platform","linux/"+{"x86_64":"amd64","aarch64":"arm64"}[platform.machine()],IMAGE)'
          sudo "$(command -v python)" -m evaluation.m046.docker_proofs --output "$RUNNER_TEMP/m046-direct-proofs"
      - name: Archive proof inputs and records
        if: always()
        run: |
          sudo "$(command -v python)" -m evaluation.m046.pack_evidence \
            --root "proofs=$RUNNER_TEMP/m046-direct-proofs" \
            --root "tests=$RUNNER_TEMP/m046-direct-tests.xml" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --root "direct-tests=$GITHUB_WORKSPACE/tests/test_m046_direct_resources.py" \
            --root "harness-tests=$GITHUB_WORKSPACE/tests/test_m046_benchmark.py" \
            --root "control-tests=$GITHUB_WORKSPACE/tests/test_m046_syft_controls.py" \
            --root "workflow=$GITHUB_WORKSPACE/.github/workflows/m046-direct-resources.yml" \
            --output "$RUNNER_TEMP/m046-direct-proofs.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: m046-direct-proofs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-direct-proofs.tar.gz
            ${{ runner.temp }}/m046-direct-proofs.tar.gz.sha256
          retention-days: 7
  resources:
    name: Direct inventory and export resources (${{ matrix.arch }})
    needs: proofs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Prepare pinned trusted candidate before source measurements
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r evaluation/m046/requirements-static.txt
          python -m evaluation.m046.direct_prepare --output "$RUNNER_TEMP/m046-direct-preparation"
      - name: Measure both arms under unchanged cgroup limits
        run: |
          sudo "$(command -v python)" -m evaluation.m046.direct_benchmark \
            --manifest "$RUNNER_TEMP/m046-direct-preparation/manifest.json" \
            --output "$RUNNER_TEMP/m046-direct-evidence" --repeat 3
      - name: Archive all bounded raw records, tool code and source
        if: always()
        run: |
          sudo "$(command -v python)" -m evaluation.m046.pack_evidence \
            --root "preparation=$RUNNER_TEMP/m046-direct-preparation" \
            --root "evidence=$RUNNER_TEMP/m046-direct-evidence" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --root "direct-tests=$GITHUB_WORKSPACE/tests/test_m046_direct_resources.py" \
            --root "harness-tests=$GITHUB_WORKSPACE/tests/test_m046_benchmark.py" \
            --root "workflow=$GITHUB_WORKSPACE/.github/workflows/m046-direct-resources.yml" \
            --output "$RUNNER_TEMP/m046-direct-resources.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: m046-direct-resources-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-direct-resources.tar.gz
            ${{ runner.temp }}/m046-direct-resources.tar.gz.sha256
          retention-days: 7
