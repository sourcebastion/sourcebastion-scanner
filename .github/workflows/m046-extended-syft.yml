name: M046 Extended Syft Evaluation

on:
  pull_request:
    paths:
      - evaluation/m046/**
      - tests/test_m046_syft_native.py
      - PYTHON_VERSION
      - .github/workflows/m046-extended-syft.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Extended Syft contract (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: PYTHON_VERSION
      - name: Prepare trusted Python and trace dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r evaluation/m046/requirements-static.txt
          python -m pip install pytest==8.3.5
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y strace gcc g++
          mkdir -p "$RUNNER_TEMP/m046-syft-host"
          uname -a > "$RUNNER_TEMP/m046-syft-host/uname.txt"
          strace --version > "$RUNNER_TEMP/m046-syft-host/strace.txt"
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Urnmpf --kill-child=KILL true
      - name: Verify native evaluator contracts
        run: python -m pytest tests/test_m046_syft_native.py -q --junitxml="$RUNNER_TEMP/m046-syft-host/tests.xml"
      - name: Build and test pinned native library candidate
        run: python -m evaluation.m046.syft_prepare --output "$RUNNER_TEMP/m046-syft-preparation"
      - name: Evaluate synthetic corpus offline
        run: |
          python -m evaluation.m046.syft_native --binary "$RUNNER_TEMP/m046-syft-preparation/m046-syft" \
            --preparation-manifest "$RUNNER_TEMP/m046-syft-preparation/manifest.json" \
            --strace /usr/bin/strace --output "$RUNNER_TEMP/m046-syft-evidence"
      - name: Package exact source and raw evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/m046-syft-retained"
          for item in manifest.json buildinfo.stdout modules.stdout tests.stdout tests.stderr download.stdout download.stderr verify.stdout verify.stderr build.stdout build.stderr m046-syft; do
            if test -f "$RUNNER_TEMP/m046-syft-preparation/$item"; then
              cp "$RUNNER_TEMP/m046-syft-preparation/$item" "$RUNNER_TEMP/m046-syft-retained/$item"
            fi
          done
          python -m evaluation.m046.pack_evidence \
            --root "host=$RUNNER_TEMP/m046-syft-host" \
            --root "preparation=$RUNNER_TEMP/m046-syft-retained" \
            --root "evidence=$RUNNER_TEMP/m046-syft-evidence" \
            --root "sources=$GITHUB_WORKSPACE/evaluation/m046" \
            --root "runner-tests=$GITHUB_WORKSPACE/tests/test_m046_syft_native.py" \
            --root "inventory-tests=$GITHUB_WORKSPACE/tests/test_m046_static_inventory.py" \
            --output "$RUNNER_TEMP/m046-syft.tar.gz"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m046-extended-syft-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/m046-syft.tar.gz
            ${{ runner.temp }}/m046-syft.tar.gz.sha256
          retention-days: 7
