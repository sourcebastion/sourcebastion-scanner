# GitLab pipeline template: scan a project with SourceBastion Scan.

stages:
  - sourcebastion

variables:
  SOURCEBASTION_VERSION: "latest"
  SOURCEBASTION_IMAGE: "ghcr.io/sourcebastion/sourcebastion-scanner:$SOURCEBASTION_VERSION"


scan:pipeline:
  stage: sourcebastion
  image:
    name: $SOURCEBASTION_IMAGE
    entrypoint: [""]
  variables:
    SOURCEBASTION_OUTPUT_DIR: "scan-results"
    SOURCEBASTION_REPORT: "${SOURCEBASTION_OUTPUT_DIR}/vulnerabilities.json"
  script:
    - echo "Running SourceBastion scan..."
    - mkdir -p "${SOURCEBASTION_OUTPUT_DIR}"
    - sourcebastion status || true
    - sourcebastion gitlab-scan . --output "${SOURCEBASTION_REPORT}"
  artifacts:
    name: "ez-appsec-scan-${CI_COMMIT_SHA}"
    paths:
      - "${SOURCEBASTION_REPORT}"
    expire_in: 7 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$SOURCEBASTION_COLD_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: manual

cold:scan:
  stage: sourcebastion
  image:
    name: $SOURCEBASTION_IMAGE
    entrypoint: [""]
  variables:
    SOURCEBASTION_OUTPUT_DIR: "scan-results"
    SOURCEBASTION_REPORT: "${SOURCEBASTION_OUTPUT_DIR}/vulnerabilities.json"
  script:
    - echo "Running cold scan..."
    - mkdir -p "${SOURCEBASTION_OUTPUT_DIR}"
    - sourcebastion status || true
    - sourcebastion gitlab-scan . --output "${SOURCEBASTION_REPORT}"
  artifacts:
    name: "ez-appsec-cold-scan-${CI_COMMIT_SHA}"
    paths:
      - "${SOURCEBASTION_REPORT}"
    expire_in: 7 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: always
    - if: '$SOURCEBASTION_COLD_SCAN == "true"'
      when: always
    - when: never
